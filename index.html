<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111317">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Piano Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Piano Coach</title>
</head>
<body>
  <!-- Main screen (Today / Pieces / Metronome / Log / Settings) is drawn here by js/app.js -->
  <main id="view"></main>

  <nav id="tabs">
    <button data-act="tab" data-tab="today"><span class="ic">◐</span>Today</button>
    <button data-act="tab" data-tab="pieces"><span class="ic">♪</span>Pieces</button>
    <button data-act="tab" data-tab="metronome"><span class="ic">◷</span>Metronome</button>
    <button data-act="tab" data-tab="log"><span class="ic">▦</span>Log</button>
    <button data-act="tab" data-tab="settings"><span class="ic">⚙</span>Settings</button>
  </nav>

  <!-- Full-screen practice (clean-rep coach) -->
  <div id="coach" hidden></div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
